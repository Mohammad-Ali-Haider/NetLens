name: netlens-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: netlens_test
      POSTGRES_USER: netlens_test
      POSTGRES_PASSWORD: test-only
    ports: ["127.0.0.1:15432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netlens_test -d netlens_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
